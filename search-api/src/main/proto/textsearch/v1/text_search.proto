// Внутренний API текстового поиска.

syntax = "proto3";

package metasearch.textsearch.v1;

import "common/v1/common.proto";

option java_package = "org.krev.metasearch.proto.textsearch.v1";
option java_multiple_files = true;
option java_outer_classname = "TextSearchProto";

service TextSearchService {
  rpc Search(TextSearchRequest) returns (TextSearchResponse);
}

message TextSearchRequest {
  string query = 1;
  int32 limit = 2; // int32 Для количества результатов этого достаточно. Валидация положительного значения и верхней границы будет ответственностью сервиса.
}

message TextSearchResponse {
  repeated metasearch.common.v1.ScoredProduct results = 1;
}